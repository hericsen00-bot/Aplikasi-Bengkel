<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#334155" stroke-width="4" />

  <!-- Outer Ring Accent -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="url(#accentGrad)" stroke-width="12" stroke-dasharray="16 12" opacity="0.4" />

  <!-- Gear Badge Behind -->
  <g fill="#1e293b" stroke="#334155" stroke-width="8">
    <circle cx="256" cy="256" r="130" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="8" />
  </g>

  <!-- Crossed Tools / Wrench & Screwdriver -->
  <g transform="translate(256, 256) rotate(-45) translate(-256, -256)">
    <!-- Wrench Body -->
    <path d="M 236 120 C 205 120 180 145 180 176 C 180 193 188 208 200 218 L 200 370 C 200 385 212 396 226 396 L 286 396 C 300 396 312 385 312 370 L 312 218 C 324 208 332 193 332 176 C 332 145 307 120 276 120 C 265 120 256 125 256 125 C 256 125 247 120 236 120 Z" fill="url(#silverGrad)" />
    <!-- Wrench Head cutout -->
    <polygon points="256,130 236,170 276,170" fill="#0f172a" />
  </g>

  <g transform="translate(256, 256) rotate(45) translate(-256, -256)">
    <!-- Screwdriver / Tool Bar -->
    <rect x="240" y="130" width="32" height="250" rx="12" fill="url(#accentGrad)" />
    <circle cx="256" cy="130" r="28" fill="#10b981" />
  </g>

  <!-- Center Hub with Bengkel Initial / Logo -->
  <circle cx="256" cy="256" r="48" fill="#0f172a" stroke="#10b981" stroke-width="8" />
  <circle cx="256" cy="256" r="24" fill="#10b981" />
</svg>
